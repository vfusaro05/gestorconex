<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestor Conex: gestão simples para pequenos negócios. Lance vendas e despesas e veja quanto entrou, quanto saiu e quanto sobrou.">
<meta name="theme-color" content="#0e1726">
<meta name="gc-api" content="https://api.gestorconex.com.br">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestor Conex">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Gestor Conex</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar + coluna de trabalho no desktop, barra inferior no celular. Visão geral primeiro, detalhe um toque abaixo.
   Dois visuais: "clean" (padrão, claro) e "escuro" (data-look="escuro"). Cada um define todas as cores. */
:root{
  color-scheme:light;
  /* marinho + dourado discreto: painel financeiro sério */
  --bg:#f2f4f7; --bg-2:#ffffff; --glass:#ffffff; --glass-2:#f1f3f6; --line:#e1e5eb; --line-2:#cdd4de;
  --ink:#0e1726; --muted:#526075; --faint:#8691a4;
  --acc:#1e3f8f; --acc-soft:#edf1f9; --acc-bd:#c8d2e9; --violet:#7c5cff; --accent-ink:#ffffff; --pri:#0e1726; --gold:#c39a3e;
  --good:#0b8457; --good-soft:#e7f5ee; --good-bd:#bfe3d2; --bad:#cc3645; --bad-soft:#fcedef; --bad-bd:#f3c6cc;
  --warn:#a26300; --warn-soft:#fff4e1; --warn-bd:#efd4a2; --info:#1e3f8f; --info-soft:#edf1f9; --info-bd:#c8d2e9;
  --s1:#1f4fb8; --s2:#9aa6b8; --cmp:#bcc4cf; --pos:#1f4fb8; --neg:#e34948;
  --track:#edf0f4; --cost:#b9472f; --cost-ink:#ffffff; --profit:#1e3f8f; --profit-ink:#ffffff; --nav-bg:rgba(255,255,255,.96); --tip-bg:#ffffff;
  --side-bg:#0e1726; --side-ink:#aeb8c9; --side-ink-strong:#ffffff; --side-hover:rgba(255,255,255,.06);
  --hero-bg:#0e1726; --hero-ink:#ffffff; --hero-muted:#a3aec1; --hero-good:#4fd69c; --hero-bad:#ff8590;
  --shadow:0 1px 2px rgba(14,23,38,.06); --glow:none; --glow-txt:none; --page-img:none; --hero-glow:transparent;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
:root[data-look="escuro"]{
  color-scheme:dark;
  --bg:#05070d; --bg-2:#0a0f1a; --glass:rgba(16,23,38,.72); --glass-2:rgba(26,36,58,.6); --line:rgba(130,170,255,.13); --line-2:rgba(130,170,255,.24);
  --ink:#e9efff; --muted:#93a0bd; --faint:#5f6b86;
  --acc:#3ee0ff; --acc-soft:rgba(62,224,255,.06); --acc-bd:rgba(62,224,255,.4); --violet:#8f7bff; --accent-ink:#04121a; --pri:linear-gradient(135deg,#3ee0ff,#6aa8ff);
  --good:#3ff0a8; --good-soft:rgba(63,240,168,.12); --good-bd:rgba(63,240,168,.3); --bad:#ff5f7e; --bad-soft:rgba(255,95,126,.13); --bad-bd:rgba(255,95,126,.3);
  --warn:#ffc35a; --warn-soft:rgba(255,195,90,.12); --warn-bd:rgba(255,195,90,.3); --info:#7fb4ff; --info-soft:rgba(127,180,255,.12); --info-bd:rgba(127,180,255,.25);
  --s1:#3ee0ff; --s2:#a48cff; --cmp:#55607a; --pos:#3ee0ff; --neg:#ff5f7e;
  --track:rgba(255,255,255,.07); --cost:#ff8a70; --cost-ink:#2a0a03; --profit:#3ee0ff; --profit-ink:#04121a; --nav-bg:rgba(7,10,18,.88); --tip-bg:#0d1424;
  --hero-bg:linear-gradient(160deg,rgba(62,224,255,.10),rgba(143,123,255,.10) 55%,rgba(10,15,26,.7)),rgba(16,23,38,.72);
  --shadow:none; --glow:0 0 24px rgba(62,224,255,.25); --glow-txt:0 0 28px rgba(62,224,255,.35); --hero-glow:rgba(62,224,255,.22);
  --page-img:radial-gradient(900px 500px at 85% -10%,rgba(143,123,255,.16),transparent 60%),radial-gradient(700px 420px at -10% 20%,rgba(62,224,255,.10),transparent 60%);
  --side-bg:transparent; --side-ink:#93a0bd; --side-ink-strong:#e9efff; --side-hover:rgba(26,36,58,.6); --gold:#3ee0ff;
  --hero-ink:#e9efff; --hero-muted:#93a0bd; --hero-good:#3ff0a8; --hero-bad:#ff5f7e;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);background-image:var(--page-img);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:700}
h1{font-size:1.6rem}
h2{font-size:1.02rem;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr;max-width:1240px;margin:0 auto}
main{min-width:0;padding-block:18px 112px;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}

/* nav */
.side{display:none}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;flex:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%20fill%3D%22none%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22gc-borda%22%20x1%3D%224%22%20y1%3D%224%22%20x2%3D%2244%22%20y2%3D%2244%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%20%3Cstop%20stop-color%3D%22%23A57A26%22%2F%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23EBCB72%22%2F%3E%20%3C%2FlinearGradient%3E%20%3C%2Fdefs%3E%20%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2213%22%20fill%3D%22%230E1726%22%2F%3E%20%3Crect%20x%3D%225%22%20y%3D%225%22%20width%3D%2238%22%20height%3D%2238%22%20rx%3D%2212%22%20stroke%3D%22url(%23gc-borda)%22%20stroke-width%3D%222%22%2F%3E%20%3Crect%20x%3D%2213%22%20y%3D%2227%22%20width%3D%225.5%22%20height%3D%229%22%20rx%3D%221.6%22%20fill%3D%22%23F5F7FB%22%2F%3E%20%3Crect%20x%3D%2221.25%22%20y%3D%2222%22%20width%3D%225.5%22%20height%3D%2214%22%20rx%3D%221.6%22%20fill%3D%22%23F5F7FB%22%2F%3E%20%3Crect%20x%3D%2229.5%22%20y%3D%2217.5%22%20width%3D%225.5%22%20height%3D%2218.5%22%20rx%3D%221.6%22%20fill%3D%22%23F5F7FB%22%2F%3E%20%3Cpath%20d%3D%22M15.75%2023.2%20L24%2018.4%20L30.6%2013.6%22%20stroke%3D%22%23E2BE63%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3Ccircle%20cx%3D%2233.4%22%20cy%3D%2211.6%22%20r%3D%223.3%22%20fill%3D%22%23E2BE63%22%2F%3E%20%3Ccircle%20cx%3D%2233.4%22%20cy%3D%2211.6%22%20r%3D%221.4%22%20fill%3D%22%230E1726%22%2F%3E%20%3C%2Fsvg%3E%20") center/contain no-repeat;font-size:0;color:transparent;box-shadow:none}
.brand .cx{color:var(--gold)}
.auth-mbrand .cx{color:#b08a33}
.brand b{font-family:var(--f-display);font-size:1.08rem;display:block;line-height:1.1;font-weight:700;letter-spacing:.02em;color:var(--side-ink-strong)}
.brand small{color:var(--side-ink);font-size:.8rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 14px;border-radius:8px;color:var(--side-ink);font-weight:600;text-align:left}
.nav button:hover{background:var(--side-hover);color:var(--side-ink-strong)}
.nav button[aria-current="page"]{background:var(--side-hover);color:var(--side-ink-strong);box-shadow:inset 3px 0 0 var(--gold)}
.side-foot{margin-top:auto;font-size:.75rem;color:var(--side-ink);opacity:.7}
.nav svg,.bottom svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;color:var(--faint);font-size:.7rem;font-weight:700;border-radius:12px}
.bottom button[aria-current="page"]{color:var(--acc)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media (min-width:900px){
  .app{display:block;max-width:none;padding-left:236px}
  .side{display:flex;flex-direction:column;gap:30px;position:fixed;left:0;top:0;bottom:0;width:236px;padding:28px 16px;background:var(--side-bg);z-index:15}
  .bottom{display:none}
  .topbar .brand{display:none}
  main{padding-block:28px 48px;max-width:1120px;margin:0 auto;padding-inline:clamp(0px,2vw,24px)}
}

/* superfícies */
.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h p{margin:0;color:var(--muted);font-size:.85rem}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line-2);background:var(--glass);padding:10px 15px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--pri);color:var(--accent-ink);border-color:transparent;box-shadow:var(--glow)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-bd);background:transparent}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:.85rem}
.btn.big{width:100%;padding:15px;font-size:1rem}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass);display:grid;place-items:center;font-size:1.2rem;font-weight:700;padding:0}
.icon-btn:disabled{opacity:.35;cursor:default}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--info-soft);border:1px solid var(--info-bd);border-radius:14px;padding:10px 14px;font-size:.86rem}
.banner b{color:var(--info)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1050px){.grid2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}

/* controles */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--glass-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12),inset 0 0 0 1px var(--line)}
.seg.view{width:100%;display:grid;grid-template-columns:1fr 1fr}
.seg.view button{padding:10px}
.seg.view button[aria-pressed="true"]{color:var(--acc)}
.period{display:flex;align-items:center;gap:8px;min-width:0}
.period .lbl{font-weight:700;font-family:var(--f-display);min-width:0}
.period .lbl small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.78rem}
select.sel{border:1px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:9px 10px;max-width:100%}

/* VISÃO GERAL */
.hero{position:relative;overflow:hidden;border-radius:14px;padding:24px 22px 22px;border:1px solid var(--line);background:var(--hero-bg);color:var(--hero-ink);box-shadow:0 12px 32px rgba(14,23,38,.16)}
.hero::before{content:"";position:absolute;left:22px;top:0;width:56px;height:3px;background:var(--gold)}
.hero::after{content:"";position:absolute;inset:auto -30% -60% auto;width:340px;height:340px;border-radius:50%;background:radial-gradient(closest-side,var(--hero-glow),transparent);pointer-events:none}
.hero .eyebrow{color:var(--hero-muted)}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero .big{font-family:var(--f-display);font-weight:600;font-size:clamp(2.6rem,11vw,4rem);line-height:1;margin:16px 0 12px;letter-spacing:-.04em;text-shadow:var(--glow-txt)}
.hero .big.neg{color:var(--hero-bad)}
.hero .say{font-size:1rem;font-weight:500;max-width:44ch;color:var(--hero-muted)}
.hero .say .up{color:var(--hero-good);font-weight:700} .hero .say .dn{color:var(--hero-bad);font-weight:700}
.hero .status{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
.hero .status.good{color:var(--hero-good)} .hero .status.warn{color:#f5c56a} .hero .status.bad{color:var(--hero-bad)}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-weight:800;font-size:.82rem;border:1px solid}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.status.good{color:var(--good);border-color:var(--good-bd);background:var(--good-soft)}
.status.warn{color:var(--warn);border-color:var(--warn-bd);background:var(--warn-soft)}
.status.bad{color:var(--bad);border-color:var(--bad-bd);background:var(--bad-soft)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .t{font-size:.84rem;color:var(--muted)}
.tile .t b{color:var(--ink)}
.tile .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800}
.tile.in .ico{background:var(--acc-soft);color:var(--s1)}
.tile.out .ico{background:var(--glass-2);color:var(--s2)}
.cmpbars{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.cmpbars div{display:grid;grid-template-columns:3.4rem minmax(0,1fr);align-items:center;gap:8px;font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.cmpbars span{display:block;height:6px;border-radius:0 4px 4px 0;min-width:2px}
.tile.in .cmpbars .now{background:var(--s1)}
.tile.out .cmpbars .now{background:var(--s2)}
.cmpbars .was{background:var(--cmp)}
.tile .who{font-weight:700;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px dashed var(--acc-bd);border-radius:var(--r);padding:14px 16px;background:var(--acc-soft)}
.cta b{display:block}

/* frases / alertas */
.ins{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.ins li:first-child{border-top:0;padding-top:0}
.ins .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800}
.ins .bad .ic{background:var(--bad-soft);color:var(--bad)} .ins .good .ic{background:var(--good-soft);color:var(--good)}
.ins .warn .ic{background:var(--warn-soft);color:var(--warn)} .ins .info .ic{background:var(--info-soft);color:var(--info)}
.ins b{display:block;font-weight:700}
.ins span{color:var(--muted);font-size:.87rem}
.ins.simple b{font-size:1rem}

/* KPIs detalhados */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1150px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v.neg{color:var(--bad)}
.kpi .s{font-size:.76rem;color:var(--muted)}
.kpi.hero2{border-color:var(--acc-bd)}
.kpi.hero2 .v{color:var(--acc)}
.d{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:99px;width:max-content}
.d.good{background:var(--good-soft);color:var(--good)} .d.bad{background:var(--bad-soft);color:var(--bad)} .d.flat{background:var(--glass-2);color:var(--muted)}

/* gráficos */
.chart{position:relative;width:100%;min-height:220px}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.sq{height:10px;width:10px;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:var(--tip-bg);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(16,24,40,.18);border-radius:12px;padding:9px 11px;font-size:.8rem;min-width:150px;z-index:5}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px}

/* ajudou x atrapalhou */
.sumline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:16px;font-size:1.02rem;font-weight:600}
.big2{font-family:var(--f-display);font-size:1.7rem;font-weight:800}
.tg{color:var(--good)} .tb{color:var(--bad)}
.aa{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
.cr-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cr-ctl .sel{padding:7px 10px;font-size:.88rem}
/* indicadores de referência e curva ABC */
.inds{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.ind{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--glass)}
.ind-v{font-family:var(--f-display);font-weight:600;font-size:1.5rem;letter-spacing:-.02em}
.ind p{margin:0;font-size:.84rem;color:var(--muted);line-height:1.45}

.abc{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:800;font-size:.75rem}
.abc-A{background:var(--good-soft);color:var(--good)} .abc-B{background:var(--warn-soft);color:var(--warn)} .abc-C{background:var(--glass-2);color:var(--muted)}
/* contas do mês: meta (ponto de equilíbrio) com marca e parte que virou lucro */
.eq-head{margin:0;font-family:var(--f-display);font-size:1.3rem;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.eq-sub{margin:6px 0 16px;color:var(--muted);font-size:.95rem}
.eq-bar{position:relative;height:16px;border-radius:8px;background:var(--track)}

.eq-l{background:var(--profit);border-radius:0 8px 8px 0}
.eq-mk{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:var(--gold);border-radius:2px}
.eq-leg{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-top:10px;font-size:.84rem;color:var(--muted)}

.eq-leg .sq{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.eq-c.prog,.eq-leg .sq.c.prog{background:var(--acc)} .eq-leg .sq.c{background:var(--cost)} .eq-leg .sq.l{background:var(--profit)}
/* resumo: pendência única, o que mais pesou, tabelas recolhidas */
.pend{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warn-soft);border:1px solid var(--warn-bd);border-radius:12px;padding:10px 14px;font-size:.9rem}

.peso{border-radius:12px;padding:14px;border:1px solid;display:flex;flex-direction:column;gap:6px;min-width:0}
.peso.good{background:var(--good-soft);border-color:var(--good-bd)} .peso.bad{background:var(--bad-soft);border-color:var(--bad-bd)} .peso.flat{background:var(--glass-2);border-color:var(--line)}
.peso-h{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:.82rem}
.peso.good .peso-h{color:var(--good)} .peso.bad .peso-h{color:var(--bad)} .peso.flat .peso-h{color:var(--muted)}
.peso-n{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.peso p{margin:0;font-size:.86rem;line-height:1.45}
.eyebrow .chip{border:0;cursor:pointer;vertical-align:middle;margin-left:4px;background:var(--warn-soft);color:var(--warn)}
details.fold{padding:0}
details.fold summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}

details.fold[open] summary::after{content:"Fechar"}
details.fold summary small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
details.fold .tbl-wrap{padding:0 18px 16px;margin:0}
/* visão de despesas */
.spend-v{font-family:var(--f-display);font-weight:600;font-size:clamp(2.2rem,9vw,3.2rem);letter-spacing:-.04em;line-height:1.05;margin:10px 0 8px}
.spend-s{font-size:1rem;font-weight:500;color:var(--muted)}
.spend-s b{color:var(--ink)} .spend-s .tb,.spend-s .tg{font-weight:700}
.pe-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}
.pe-bar{height:12px;border-radius:6px;background:var(--track);overflow:hidden}
.pe-bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.pe-bar i.ok{background:var(--good)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cr-list{display:flex;flex-direction:column;gap:14px}
.cr{display:flex;flex-direction:column;gap:5px}
.cr small{color:var(--muted);font-size:.8rem}
@media (min-width:760px){.aa{grid-template-columns:1fr 1fr}}
.aa-col{border-radius:14px;padding:14px;border:1px solid;display:flex;flex-direction:column;gap:14px;min-width:0}
.aa-col.good{background:var(--good-soft);border-color:var(--good-bd)}
.aa-col.bad{background:var(--bad-soft);border-color:var(--bad-bd)}
.aa-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.aa-col.good .aa-h{color:var(--good)} .aa-col.bad .aa-h{color:var(--bad)}
.aa-r{display:flex;flex-direction:column;gap:5px}
.aa-t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

:root[data-look="escuro"] .aa-col .aa-bar{background:var(--track)}
.aa-bar i{display:block;height:100%;border-radius:3px}
.aa-col.good .aa-bar i{background:var(--good)} .aa-col.bad .aa-bar i{background:var(--bad)}
.aa-r small{color:var(--muted);font-size:.8rem}
.aa-r small.why{font-size:.85rem;line-height:1.45;color:var(--ink);opacity:.85}

.aa-sub{margin:2px 0 0;font-size:.8rem;color:var(--muted)}

/* mês a mês */
.mm{display:flex;flex-direction:column;gap:14px}

.mm-bar i span{padding:0 8px;font-size:.74rem;font-weight:700;white-space:nowrap;font-style:normal}
.mm-bar .c span{color:var(--cost-ink)}
.mm-bar .l span{color:var(--profit-ink)}
.mm-bar .c{background:var(--cost);border-radius:4px 0 0 4px}
.mm-bar .l{background:var(--profit);border-radius:0 4px 4px 0}
.mm-v{text-align:right}

.mm-v small{color:var(--muted);font-size:.78rem}
@media (max-width:480px){.mm-r{grid-template-columns:2.8rem minmax(0,1fr) 6.9rem;gap:8px}}

/* tabelas */
.tbl-wrap{overflow-x:auto;margin:0 -4px}

.chip{font-size:.66rem;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--glass-2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}

/* lançamentos */
.entry-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.vlist{display:flex;flex-direction:column}

.daybar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--pri);color:var(--accent-ink);border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 10px 28px rgba(16,24,40,.22)}

.money{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2);padding-left:10px;width:9.5rem}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}

.ap-big{font-family:var(--f-display);font-size:2.3rem;font-weight:600;letter-spacing:-.04em;color:#fff;margin:10px 0 6px}

.a-form{display:flex;flex-direction:column;gap:12px}

.cap{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line-2);border-radius:10px;background:var(--glass-2);padding:12px 14px;max-width:320px}

<script>
// modo produção (site): a página traz <meta name="gc-api" content="https://…">; sem ela é o protótipo local
const API_BASE=(typeof document!=='undefined'&&document.querySelector&&(document.querySelector('meta[name="gc-api"]')||{}).content)||'';
const REAL=!!API_BASE;
// app instalado pelas lojas (Capacitor): sem preço, plano nem pagamento dentro do app (regra 3.1.1 da Apple e de pagamentos da
// Google Play); a assinatura é feita só pelo site, como no Chat Conex. O app só mostra a situação da conta.
const NATIVO=typeof window!=='undefined'&&!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const ymOf=s=>s.slice(0,7);
const dim=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const addMonths=(s,n)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const ym=ds(d).slice(0,7);return ym+'-'+pad(Math.min(day,dim(ym)))};
const addYm=(ym,n)=>addMonths(ym+'-01',n).slice(0,7);
const weekStart=s=>addDays(s,-((pd(s).getDay()+6)%7));
const TODAY=ds(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brlF=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl0F=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl=v=>brlF.format(v||0).replace('-','−');
const brl0=v=>brl0F.format(Math.round(v||0)).replace('-','−');
const brlK=v=>Math.abs(v)>=1000?'R$ '+(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':'R$ '+Math.round(v);
const pct=(a,b)=>b?(a-b)/Math.abs(b):(a?Infinity:0);
const fmtPct=p=>!isFinite(p)?'novo':((p>0?'+':p<0?'−':'')+Math.abs(p*100).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%');
const absPct=p=>Math.abs(p*100).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%';
const num=v=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const parseBRL=s=>{s=String(s).replace(/\s|R\$/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const fmtIn=v=>v==null||v===''?'':Number(v).toFixed(2).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,9);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const SEML=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dShort=s=>{const d=pd(s);return `${d.getDate()} ${MES3[d.getMonth()]}`};
const ymLabel=ym=>{const[y,m]=ym.split('-').map(Number);return `${cap(MESES[m-1])} ${y}`};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- modelos por segmento ---------- */
const MODELOS={
  'Barbearia':{itens:[['Corte','servico',45,0],['Barba','servico',35,0],['Corte + barba','servico',70,0],['Sobrancelha','servico',15,0],['Pomada modeladora','produto',35,15],['Gel fixador','produto',20,8]],
    despesas:[['Aluguel','fixa'],['Energia','variavel'],['Internet','fixa'],['Água','variavel'],['Lâminas e descartáveis','variavel'],['Comissões','variavel'],['Taxas da maquininha','variavel'],['Contador','fixa'],['Lavanderia das toalhas','variavel','semanal'],['Café para clientes','variavel','diaria']]},
  'Salão de beleza':{itens:[['Corte feminino','servico',80,0],['Escova','servico',50,0],['Manicure','servico',35,0],['Coloração','servico',150,0],['Shampoo','produto',45,22]],
    despesas:[['Aluguel','fixa'],['Energia','variavel'],['Água','variavel'],['Internet','fixa'],['Produtos de uso','variavel'],['Comissões','variavel'],['Taxas da maquininha','variavel'],['Contador','fixa']]},
  'Lanchonete':{itens:[['X-burger','produto',28,11],['Batata frita','produto',18,6],['Refrigerante lata','produto',7,3.5],['Suco natural','produto',10,3],['Combo do dia','produto',38,15]],
    despesas:[['Aluguel','fixa'],['Energia','variavel'],['Gás','variavel'],['Água','variavel'],['Internet','fixa'],['Funcionários','fixa'],['Embalagens','variavel'],['Taxa de delivery','variavel'],['Contador','fixa'],['Hortifruti','variavel','semanal'],['Pão','variavel','diaria']]},
  'Pet shop':{itens:[['Banho','servico',50,0],['Banho e tosa','servico',85,0],['Ração (kg)','produto',22,14],['Petiscos','produto',15,7],['Consulta','servico',120,0]],
    despesas:[['Aluguel','fixa'],['Energia','variavel'],['Água','variavel'],['Internet','fixa'],['Shampoos e insumos','variavel'],['Funcionários','fixa'],['Contador','fixa']]},
  'Oficina':{itens:[['Troca de óleo','servico',60,0],['Alinhamento','servico',80,0],['Revisão','servico',250,0],['Óleo (litro)','produto',45,28],['Filtro','produto',40,22]],
    despesas:[['Aluguel','fixa'],['Energia','variavel'],['Internet','fixa'],['Ferramentas','variavel'],['Funcionários','fixa'],['Contador','fixa']]},
  'Outro':{itens:[],despesas:[['Aluguel','fixa'],['Energia','variavel'],['Internet','fixa'],['Água','variavel'],['Contador','fixa']]}
};

/* ---------- dados de exemplo ---------- */
/* Cenários do simulador: só o mês atual muda; os anteriores ficam normais para servir de comparação */
const CENARIOS={
  misto:{nome:'Misto: algumas quedas e uma conta subindo',it:{barba:.6,pomada:.45,corte:1.05,pigm:1.5,combo:.97},all:1,desp:{energia:1.38}},
  normal:{nome:'Mês normal, sem surpresas',it:{},all:1,desp:{}},
  queda:{nome:'Vendas em queda',it:{barba:.6,combo:.8},all:.78,desp:{}},
  custos:{nome:'Custos subindo',it:{},all:.97,desp:{energia:1.6,aluguel:1.3,comissao:1.3,laminas:1.5,cafe:1.4,lavanderia:1.4,marketing:1.5}},
  cresc:{nome:'Crescimento',it:{pigm:1.6,oleo:1.5},all:1.2,desp:{marketing:1.5}},
  prejuizo:{nome:'Prejuízo',it:{},all:.36,desp:{energia:1.2}}
};
function seedExemplo(o={}){
  const cen=CENARIOS[o.cenario]||CENARIOS.misto,mov=o.mov||1,meses=o.meses||6;
  const rnd=mulberry32(o.seed||11);
  const IT=[['corte','Corte','servico',45,0,6],['barba','Barba','servico',35,0,2.6],['combo','Corte + barba','servico',70,0,3],['sobr','Sobrancelha','servico',15,0,1.4],['pigm','Pigmentação de barba','servico',40,0,.6],
    ['pomada','Pomada modeladora','produto',35,15,1.4],['gel','Gel fixador','produto',20,8,1],['oleo','Óleo para barba','produto',40,18,.6],['bebida','Bebidas','produto',8,3.5,4]];
  const DP=[['aluguel','Aluguel','fixa'],['comissao','Comissão do barbeiro','variavel'],['energia','Energia','variavel'],['maquininha','Taxas da maquininha','variavel'],['laminas','Lâminas e descartáveis','variavel'],
    ['contador','Contador','fixa'],['marketing','Marketing e Instagram','fixa'],['internet','Internet','fixa'],['agua','Água','variavel'],['limpeza','Produtos de limpeza','variavel'],
    ['lavanderia','Lavanderia das toalhas','variavel','semanal'],['cafe','Café e água para clientes','variavel','diaria']];
  const curYm=ymOf(TODAY), firstYm=addYm(curYm,-(meses-1)), yest=addDays(TODAY,-1);
  const WF=[0,.7,.95,1,1.05,1.3,1.6];
  const dF=(id,ym)=>ym===curYm?(cen.desp[id]||1):1;
  const vendas={},gastos={},gastosS={},gastosD={},mFat={};
  for(let w=weekStart(firstYm+'-01');w<=yest;w=addDays(w,7))gastosS[w]={lavanderia:Math.round((55+rnd()*20)*mov*dF('lavanderia',ymOf(w)))};
  for(let d=firstYm+'-01';d<=yest;d=addDays(d,1)){
    const wd=pd(d).getDay(); if(!wd) continue;
    const ym=ymOf(d), mi=(+ym.slice(0,4)-+firstYm.slice(0,4))*12+(+ym.slice(5)-+firstYm.slice(5)), isCur=ym===curYm;
    gastosD[d]={cafe:Math.round((9+rnd()*7)*dF('cafe',ym))};
    const day={}; let tot=0;
    for(const[id,,,preco,custo,base] of IT){
      const f=isCur?cen.all*(cen.it[id]||1):1;
      const q=Math.round(base*mov*WF[wd]*(1+.025*mi)*f*(.7+rnd()*.6));
      if(q>0){day[id]={q,p:preco,c:custo};tot+=q*preco}
    }
    vendas[d]=day; mFat[ym]=(mFat[ym]||0)+tot;
  }
  for(let i=0;i<meses;i++){
    const ym=addYm(firstYm,i), isCur=ym===curYm, base=isCur?(mFat[addYm(ym,-1)]||mFat[ym]||0):(mFat[ym]||0);
    const g={aluguel:2200,comissao:Math.round(4200*Math.sqrt(mov)),energia:Math.round(420*(1+(rnd()-.5)*.12)),maquininha:Math.round(base*.024),
      laminas:Math.round((260+rnd()*50)*mov),contador:350,marketing:200,internet:130,agua:Math.round(100+rnd()*25),limpeza:Math.round(80+rnd()*25)};
    for(const id in g)g[id]=Math.round(g[id]*dF(id,ym));
    gastos[ym]=g;
  }
  return {v:1,exemplo:true,sim:cen.nome,negocio:{nome:'Barbearia do Zé',segmento:'Barbearia',dias:[1,2,3,4,5,6]},
    itens:IT.map(([id,nome,tipo,preco,custo])=>({id,nome,tipo,preco,custo,ativo:true})),
    despesas:DP.map(([id,nome,cat,freq])=>({id,nome,cat,freq:freq||'mensal',ativo:true})),vendas,gastos,gastosS,gastosD};
}
function novoNegocio(seg,nome){
  const m=MODELOS[seg]||MODELOS.Outro;
  return {v:1,exemplo:false,negocio:{nome:nome||'Meu negócio',segmento:seg,dias:[1,2,3,4,5,6]},
    itens:m.itens.map(([nome,tipo,preco,custo])=>({id:uid(),nome,tipo,preco,custo,ativo:true})),
    despesas:m.despesas.map(([nome,cat,freq])=>({id:uid(),nome,cat,freq:freq||'mensal',ativo:true})),vendas:{},gastos:{},gastosS:{},gastosD:{}};
}

/* ---------- estado ---------- */
const KEY='balcao.v1', UKEY='balcao.ui2';
let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.itens) S=seedExemplo();
// Despesas: mensal em S.gastos[AAAA-MM], semanal em S.gastosS[segunda-feira], diária em S.gastosD[data]
S.gastosS=S.gastosS||{};S.gastosD=S.gastosD||{};S.despesas.forEach(x=>{x.freq=x.freq||'mensal'});
let ui={tab:'painel',view:'geral',mode:'mes',ref:TODAY,cmp:'mes',vDate:TODAY,gFreq:'mensal',gYm:ymOf(TODAY),gW:weekStart(TODAY),gD:TODAY};
ui.look='clean';
try{const u=JSON.parse(localStorage.getItem(UKEY));if(u){if(u.tab)ui.tab=u.tab;if(u.mode)ui.mode=u.mode;if(u.view)ui.view=u.view;if(u.look)ui.look=u.look}}catch(e){}
const applyLook=()=>{if(ui.look==='escuro')document.documentElement.setAttribute('data-look','escuro');else document.documentElement.removeAttribute('data-look')};
applyLook();
const save=()=>{agendaLembretes();if(REAL&&C&&C.real)return queueSync();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const saveUi=()=>{try{localStorage.setItem(UKEY,JSON.stringify({tab:ui.tab,mode:ui.mode,view:ui.view,look:ui.look}))}catch(e){}};
const itemById=id=>S.itens.find(i=>i.id===id);
const despById=id=>S.despesas.find(i=>i.id===id);
let toastT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------- períodos ---------- */
function getRange(mode,ref){
  if(mode==='dia') return {s:ref,e:ref};
  if(mode==='semana'){const w=(pd(ref).getDay()+6)%7,s=addDays(ref,-w);return {s,e:addDays(s,6)}}
  const ym=ymOf(ref);return {s:ym+'-01',e:ym+'-'+pad(dim(ym))};
}
// Até onde há dados: hoje, se já lançou; senão, até ontem
const lastDataDay=()=>S.vendas[TODAY]?TODAY:addDays(TODAY,-1);
function cmpRange(mode,r,how){
  if(mode==='dia') return how==='sem'?{s:addDays(r.s,-7),e:addDays(r.s,-7)}:{s:addMonths(r.s,-1),e:addMonths(r.s,-1)};
  if(mode==='semana'){const k=how==='sem'?-7:-28;return {s:addDays(r.s,k),e:addDays(r.e,k)}}
  const s=addMonths(r.s,-1), full=r.e===ymOf(r.s)+'-'+pad(dim(ymOf(r.s)));
  return {s,e:full?ymOf(s)+'-'+pad(dim(ymOf(s))):addMonths(r.e,-1)};
}
function rangeLabel(mode,r){
  if(mode==='dia'){const d=pd(r.s);return cap(d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}))}
  if(mode==='semana') return `${dShort(r.s)} – ${dShort(r.e)}`;
  return ymLabel(ymOf(r.s));
}
function cmpLabel(mode,c){
  if(mode==='dia') return dShort(c.s);
  if(mode==='semana') return `${dShort(c.s)} – ${dShort(c.e)}`;
  const full=c.e.slice(8)===pad(dim(ymOf(c.s)));
  return full?MESES[pd(c.s).getMonth()]:`1 a ${dShort(c.e)}`;
}
// Frase amigável para a visão geral
function cmpFriendly(mode,c,how){
  const mes=MESES[pd(c.s).getMonth()];
  if(mode==='dia') return how==='sem'?'no mesmo dia da semana passada':`no mesmo dia de ${mes}`;
  if(mode==='semana') return how==='sem'?'na semana passada':`na mesma semana de ${mes}`;
  return c.e.slice(8)===pad(dim(ymOf(c.s)))?`em ${mes}`:`no mesmo período de ${mes}`;
}
const stepRef=n=>ui.mode==='dia'?addDays(ui.ref,n):ui.mode==='semana'?addDays(ui.ref,7*n):addMonths(ui.ref,n);

/* ---------- cálculo ---------- */
function metrics(r){
  const m={fat:0,cmv:0,desp:0,serv:0,prod:0,itens:{},desps:{},dias:[],abertos:0,lanc:0};
  const dias=S.negocio.dias||[1,2,3,4,5,6];
  for(let d=r.s;d<=r.e;d=addDays(d,1)){
    const v=S.vendas[d]; let f=0;
    if(v){m.lanc++;for(const id in v){const x=v[id],val=x.q*x.p,cv=x.q*(x.c||0);f+=val;m.cmv+=cv;
      const it=m.itens[id]||(m.itens[id]={q:0,fat:0,cmv:0});it.q+=x.q;it.fat+=val;it.cmv+=cv;
      if((itemById(id)||{}).tipo==='servico')m.serv+=x.q;else m.prod+=x.q}}
    if(dias.includes(pd(d).getDay()))m.abertos++;
    m.fat+=f;m.dias.push({d,fat:f});
    // rateio: mensal ÷ dias do mês, semanal ÷ 7, diária no próprio dia
    const add=(id,a)=>{m.desp+=a;m.desps[id]=(m.desps[id]||0)+a};
    const ym=ymOf(d),g=S.gastos[ym]||{},n=dim(ym);
    for(const id in g)add(id,(+g[id]||0)/n);
    const gw=S.gastosS[weekStart(d)];if(gw)for(const id in gw)add(id,(+gw[id]||0)/7);
    const gd=S.gastosD[d];if(gd)for(const id in gd)add(id,+gd[id]||0);
  }
  m.custo=m.desp+m.cmv;m.lucro=m.fat-m.custo;m.margem=m.fat?m.lucro/m.fat:0;m.ticket=m.serv?m.fat/m.serv:0;
  return m;
}
function dayFat(d){const v=S.vendas[d];if(!v)return null;let f=0;for(const id in v)f+=v[id].q*v[id].p;return f}

/* Gera os avisos. Cada um tem versão curta (s) para a visão geral e completa (t/x) para o detalhe. */
function insights(cur,prev,ctx,fr){
  const out=[];
  if(cur.fat===0&&prev.fat===0){out.push({tone:'info',ic:'i',s:'Ainda não há vendas lançadas',t:'Sem vendas lançadas neste período',x:'Lance as vendas do dia na aba Vendas para ver os indicadores.'});return out}
  if(prev.fat>0){
    const p=pct(cur.fat,prev.fat);
    if(p<=-.03) out.push({k:'fat',tone:'bad',ic:'↓',s:`Você vendeu ${absPct(p)} menos que ${fr}`,t:`Faturamento ${fmtPct(p)} vs ${ctx}`,x:`${brl0(cur.fat)} contra ${brl0(prev.fat)} (${brl0(cur.fat-prev.fat)}).`});
    else if(p>=.03) out.push({k:'fat',tone:'good',ic:'↑',s:`Você vendeu ${absPct(p)} mais que ${fr}`,t:`Faturamento ${fmtPct(p)} vs ${ctx}`,x:`${brl0(cur.fat)} contra ${brl0(prev.fat)} (+${brl0(cur.fat-prev.fat)}).`});
    else out.push({k:'fat',tone:'info',ic:'=',s:`Vendas iguais ${fr}`,t:`Faturamento estável vs ${ctx}`,x:`${brl0(cur.fat)} contra ${brl0(prev.fat)}.`});
  }
  const ids=new Set([...Object.keys(cur.itens),...Object.keys(prev.itens)]);
  const dif=[...ids].map(id=>{const a=cur.itens[id]||{q:0,fat:0},b=prev.itens[id]||{q:0,fat:0};return {id,n:(itemById(id)||{nome:'Item removido'}).nome,a,b,d:a.fat-b.fat,p:pct(a.fat,b.fat)}});
  const down=dif.filter(x=>x.b.fat>0&&x.p<=-.1&&x.d<0).sort((a,b)=>a.d-b.d);
  if(down.length){const x=down[0],o=down.slice(1,3).map(y=>`${y.n} (${fmtPct(y.p)})`);
    out.push({tone:'bad',ic:'↓',s:`${x.n} caiu ${absPct(x.p)}`,sx:`${num(x.a.q)} vendas contra ${num(x.b.q)}. É o que mais puxou para baixo.`,t:`${x.n} em queda: ${fmtPct(x.p)}`,x:`Vendeu ${num(x.a.q)} contra ${num(x.b.q)}, ${brl0(x.d)} na receita.${o.length?' Também caíram: '+o.join(', ')+'.':''}`})}
  const up=dif.filter(x=>x.b.fat>0&&x.p>=.1&&x.d>0).sort((a,b)=>b.d-a.d);
  if(up.length){const x=up[0];out.push({tone:'good',ic:'↑',s:`${x.n} cresceu ${absPct(x.p)}`,sx:`+${brl0(x.d)} a mais no caixa.`,t:`${x.n} crescendo: ${fmtPct(x.p)}`,x:`Vendeu ${num(x.a.q)} contra ${num(x.b.q)}, +${brl0(x.d)} na receita.`})}
  const dids=new Set([...Object.keys(cur.desps),...Object.keys(prev.desps)]);
  const dd=[...dids].map(id=>{const a=cur.desps[id]||0,b=prev.desps[id]||0;return {id,n:(despById(id)||{nome:'Despesa removida'}).nome,a,b,d:a-b,p:pct(a,b)}}).filter(x=>x.b>0&&x.p>=.1&&x.d>15).sort((a,b)=>b.d-a.d);
  if(dd.length){const x=dd[0];out.push({tone:'warn',ic:'!',s:`A conta de ${x.n.toLowerCase()} subiu ${absPct(x.p)}`,sx:'Vale conferir o que aconteceu.',t:`${x.n} subiu ${fmtPct(x.p)}`,x:`${brl0(x.a)} contra ${brl0(x.b)} no período (+${brl0(x.d)}). Vale conferir a conta.`})}
  const all=Object.entries(cur.desps).map(([id,v])=>({n:(despById(id)||{nome:'?'}).nome,v}));
  if(cur.cmv>0)all.push({n:'Custo dos produtos vendidos',v:cur.cmv});
  all.sort((a,b)=>b.v-a.v);
  if(all.length&&cur.custo>0){const t=all[0];out.push({k:'top',tone:'info',ic:'i',t:`Maior custo: ${t.n}`,x:`${brl0(t.v)}, ${Math.round(t.v/cur.custo*100)}% de tudo que saiu e ${cur.fat?Math.round(t.v/cur.fat*100):0}% do faturamento.`})}
  if(cur.fat>0){
    if(cur.lucro<0) out.push({tone:'bad',ic:'!',s:'Gastou mais do que vendeu',sx:`Faltaram ${brl0(-cur.lucro)} para fechar a conta.`,t:'Prejuízo no período',x:`Os custos passaram o faturamento em ${brl0(-cur.lucro)}.`});
    else if(cur.margem<.15) out.push({tone:'warn',ic:'!',s:'Está sobrando pouco',sx:'De cada R$ 100 vendidos, sobram menos de R$ 15.',t:`Margem apertada: ${Math.round(cur.margem*100)}%`,x:'De cada R$ 100 vendidos, sobram menos de R$ 15.'});
  }
  return out;
}

let P=null;
function calc(){
  const r0=getRange(ui.mode,ui.ref);
  let e=r0.e;const lim=lastDataDay();if(ui.mode!=='dia'&&e>lim)e=lim;if(e<r0.s)e=r0.s;
  const r={s:r0.s,e};

  const cur=metrics(r),prev=metrics(c);
  const ctx=cmpLabel(ui.mode,c),fr=cmpFriendly(ui.mode,c,ui.cmp);
  P={r0,r,c,cur,prev,ctx,fr,partial:r.e<r0.e,ins:insights(cur,prev,ctx,fr)};
  return P;
}
function health(cur,prev){
  if(cur.fat>0&&cur.lucro<0)return {c:'bad',t:'Precisa de atenção'};
  const p=prev.fat?pct(cur.fat,prev.fat):0;
  if(cur.fat>0&&(cur.margem<.15||p<=-.1))return {c:'warn',t:'Fique de olho'};
  if(!cur.fat)return {c:'warn',t:'Sem vendas lançadas'};

}

/* ---------- cálculos usados pelas duas telas ---------- */
const sg=v=>(v>=0?'+':'−')+brl0(Math.abs(v));
// O que ajudou e o que atrapalhou o lucro: lucro antes + ajudou + atrapalhou + pequenas variações = lucro agora
function impacto(){
  const {r,c,cur,prev}=P,SMALL=30;
  const ids=new Set([...Object.keys(cur.itens),...Object.keys(prev.itens)]),dids=new Set([...Object.keys(cur.desps),...Object.keys(prev.desps)]);
  const un=x=>x.q?(x.fat-x.cmv)/x.q:0,pl=(n,s,p)=>`${num(n)} ${n===1?s:p}`;
  const whyItem=(it,a,b)=>{const serv=(it||{}).tipo==='servico',dq=a.q-b.q,ua=un(a),ub=un(b),u=a.q?ua:ub,ref=a.q?a:b;
    const cada=serv?'Cada atendimento rende':'Cada unidade rende',w=serv?['atendimento','atendimentos']:['unidade','unidades'];
    const custo=ref.q&&ref.cmv>0?` (preço ${brl0(ref.fat/ref.q)} menos custo ${brl0(ref.cmv/ref.q)})`:'';
    if(!b.q)return `<b>Porque</b> não tinha vendido antes e agora vendeu ${pl(a.q,...w)}. ${cada} ${brl0(u)} de lucro${custo}.`;
    if(!a.q)return `<b>Porque</b> não vendeu nenhum neste período, e antes tinha vendido ${pl(b.q,...w)}.`;
    if(!dq)return `<b>Porque</b>, com a mesma quantidade (${pl(a.q,...w)}), o lucro de cada um ${ua>ub?'subiu':'caiu'} de ${brl0(ub)} para ${brl0(ua)}.`;
    let t=`<b>Porque</b> você vendeu ${pl(Math.abs(dq),...w)} a ${dq>0?'mais':'menos'} (${num(a.q)} agora, ${num(b.q)} antes). ${cada} ${brl0(u)} de lucro${custo}.`;
    if(Math.abs(ua-ub)>=1)t+=` O lucro de cada um também ${ua>ub?'subiu':'caiu'}, de ${brl0(ub)} para ${brl0(ua)}.`;
    return t};
  const whyConta=(n,a,b)=>{const nm=esc(n.toLowerCase());
    if(!b)return `<b>Porque</b> é um gasto novo: ${brl0(a)} com ${nm} neste período.`;
    if(!a)return `<b>Porque</b> não teve gasto com ${nm} neste período. Antes foram ${brl0(b)}.`;
    return `<b>Porque</b> você gastou ${brl0(Math.abs(a-b))} a ${a>b?'mais':'menos'} com ${nm}: ${brl0(a)} agora, ${brl0(b)} antes.`};
  const rows=[...[...ids].map(id=>{const it=itemById(id),a=cur.itens[id]||{q:0,fat:0,cmv:0},b=prev.itens[id]||{q:0,fat:0,cmv:0};
      return {n:(it||{nome:'Item removido'}).nome,k:'venda',v:(a.fat-a.cmv)-(b.fat-b.cmv),t:whyItem(it,a,b)}}),
    ...[...dids].map(id=>{const a=cur.desps[id]||0,b=prev.desps[id]||0,n=(despById(id)||{nome:'Despesa removida'}).nome;
      // conta mensal com o mesmo valor nos dois meses: a diferença vem só do número de dias do mês, não é gasto real
      const ma=(S.gastos[ymOf(r.s)]||{})[id],mb=(S.gastos[ymOf(c.s)]||{})[id],igual=ymOf(r.s)!==ymOf(c.s)&&ma!=null&&ma===mb;
      return {n,k:igual?'dias':'conta',v:b-a,t:whyConta(n,a,b)}})];
  const big=x=>Math.abs(x.v)>=SMALL&&x.k!=='dias';
  const pos=rows.filter(x=>big(x)&&x.v>0).sort((a,b)=>b.v-a.v),neg=rows.filter(x=>big(x)&&x.v<0).sort((a,b)=>a.v-b.v);
  // todas as linhas entram em alguma soma, para a ponte fechar centavo a centavo
  const diasAll=rows.filter(x=>x.k==='dias'),diasRows=diasAll.filter(x=>Math.abs(x.v)>=1);
  let diasSum=diasAll.reduce((a,b)=>a+b.v,0),small=rows.filter(x=>!big(x)&&x.k!=='dias').reduce((a,b)=>a+b.v,0);
  if(Math.abs(diasSum)<1){small+=diasSum;diasSum=0}
  return {SMALL,pos,neg,sumP:pos.reduce((a,b)=>a+b.v,0),sumN:neg.reduce((a,b)=>a+b.v,0),small,diasRows,diasSum,dL:cur.lucro-prev.lucro};
}
// Separa custos fixos e variáveis (cadastro da despesa) e calcula os indicadores do Sebrae para um período
function custosPorTipo(m){let fixo=0,vari=0;for(const id in m.desps){const d=despById(id);if(d&&d.cat==='fixa')fixo+=m.desps[id];else vari+=m.desps[id]}return {fixo,vari}}
function indicadores(m){const {fixo,vari}=custosPorTipo(m),f=m.fat;
  return {fixo,vari,lucr:f?m.lucro/f:null,mc:f?(f-m.cmv-vari)/f:null,ticket:m.serv?f/m.serv:(m.prod?f/m.prod:null),porServ:!!m.serv,pesoFixo:f?fixo/f:null}}
// Ponto de equilíbrio (Sebrae): custos fixos do mês ÷ margem de contribuição %.
// Margem de contribuição = (vendas − custo dos produtos − despesas variáveis) ÷ vendas.
function equilibrio(){const ym=ymOf(P.r.s),mS=ym+'-01',mE=ym+'-'+pad(dim(ym)),lim=lastDataDay(),mEff=mE>lim?lim:mE;
  const mm=metrics({s:mS,e:mEff>=mS?mEff:mS}),k=indicadores(mm),fixoMes=k.fixo/Math.max(1,mm.dias.length)*dim(ym);
  const base={mes:MESES[+ym.slice(5)-1],atual:ym===ymOf(TODAY),feito:mm.fat,fixoMes,mc:k.mc};
  if(fixoMes<=0)return {...base,estado:'semfixo'};
  if(!mm.fat)return {...base,estado:'semvenda'};
  if(k.mc<=0)return {...base,estado:'mcneg'};
  const pe=fixoMes/k.mc,cmvR=1-k.mc;
  // dia em que as vendas acumuladas passaram da meta
  let ac=0,dia=null;for(const x of mm.dias){ac+=x.fat;if(!dia&&ac>=pe)dia=x.d}
  // se ainda não passou: projeção pelo ritmo médio dos dias com venda
  const open=S.negocio.dias||[1,2,3,4,5,6],media=mm.fat/Math.max(1,mm.lanc);let prev=null,falta=pe-mm.fat;
  if(!dia&&media>0){for(let d=addDays(mEff,1);d<=mE;d=addDays(d,1))if(open.includes(pd(d).getDay())){falta-=media;if(falta<=0){prev=d;break}}}
  return {...base,estado:'ok',pe,dia,prev,media,faltaFim:Math.max(0,falta),lucroDepois:Math.max(0,mm.fat-pe)*(1-cmvR)}}
function eqCard(){const eq=equilibrio();
  if(eq.estado!=='ok'){const msg={semfixo:['Lance suas contas fixas para ver a meta','Cadastre e lance as contas fixas do mês (aluguel, internet, contador). Com elas o app calcula quanto você precisa vender para pagar tudo.','despesas','Lançar contas'],
      semvenda:[`Ainda não há vendas em ${eq.mes}`,`As contas fixas do mês somam ${brl0(eq.fixoMes)}. Lance as vendas para o app calcular quando elas estarão pagas.`,'vendas','Lançar vendas'],
      mcneg:['As vendas não estão cobrindo nem os custos variáveis',`Produtos, comissões e taxas estão levando tudo o que entra. Assim, nenhum volume de vendas paga as contas fixas (${brl0(eq.fixoMes)}). Reveja preços e custos variáveis.`,'cadastros','Rever preços']}[eq.estado];
    return `<section class="card" data-tour="contas"><div class="card-h"><h2>Contas de ${eq.mes}</h2><span class="status ${eq.estado==='mcneg'?'bad':'warn'}"><i></i>${eq.estado==='mcneg'?'Atenção':'Sem dados'}</span></div>
      <p class="eq-head">${msg[0]}</p><p class="eq-sub">${msg[1]}</p><button class="btn sm" data-tab="${msg[2]}">${msg[3]}</button></section>`}
  const ok=!!eq.dia,max=Math.max(eq.pe,eq.feito,1),mk=eq.pe/max*100;
  const head=ok?`Você pagou as contas ${eq.atual?'':'de '+eq.mes+' '}no dia ${pd(eq.dia).getDate()}.`:eq.atual?`Faltam ${brl0(eq.pe-eq.feito)} para pagar as contas.`:`As vendas de ${eq.mes} não cobriram as contas.`;
  const sub=ok?`Depois disso, ${eq.atual?'já sobraram':'sobraram'} <b class="tg">${brl0(eq.lucroDepois)} de lucro</b>.${eq.atual?' Tudo o que vender até o fim do mês também vira lucro.':''}`
    :!eq.atual?`Faltaram ${brl0(eq.pe-eq.feito)}.`
    :eq.prev?`No ritmo atual (${brl0(eq.media)} por dia), você chega lá por volta do <b>dia ${pd(eq.prev).getDate()}</b>.`
    :`No ritmo atual (${brl0(eq.media)} por dia), o mês fecha sem cobrir tudo: faltariam <b class="tb">${brl0(eq.faltaFim)}</b>.`;
  return `<section class="card" data-tour="contas"><div class="card-h"><h2>Contas de ${eq.mes}</h2><span class="status ${ok?'good':eq.prev||!eq.atual?'warn':'bad'}"><i></i>${ok?'Pagas':eq.atual?'Em andamento':'Não cobertas'}</span></div>
    <p class="eq-head">${head}</p><p class="eq-sub">${sub}</p>
    <div class="eq-bar" role="img" aria-label="Vendido ${brl0(eq.feito)} de uma meta de ${brl0(eq.pe)}">
      <i class="eq-c ${ok?'':'prog'}" style="width:${Math.min(eq.feito,eq.pe)/max*100}%"></i>${ok?`<i class="eq-l" style="left:${mk}%;width:${100-mk}%"></i>`:''}<span class="eq-mk" style="left:${mk}%"></span></div>
    <div class="eq-leg"><span>${ok?'<i class="sq c"></i>':''}Meta para pagar as contas: <b>${brl0(eq.pe)}</b></span><span>${ok?'<i class="sq l"></i>Vendido':'<i class="sq c prog"></i>Vendido até agora'}: <b>${brl0(eq.feito)}</b></span></div>
    <p class="note" style="margin:10px 0 0">Como calculamos: contas fixas do mês (${brl0(eq.fixoMes)}) divididas pelo que sobra de cada venda depois de produtos, comissões e taxas (${Math.round(eq.mc*100)}%). É o ponto de equilíbrio.</p></section>`}
// Só a pendência mais importante, numa linha
// contas fixas mensais: no mês novo repetem sozinhas o último valor lançado. Roda uma vez por mês
// (S.fixasRep), então dá para editar ou apagar o valor repetido sem ele voltar.
function repeteFixas(){const ym=ymOf(TODAY);S.fixasRep=S.fixasRep||{};if(S.fixasRep[ym])return;
  const g=S.gastos[ym]||{},meses=Object.keys(S.gastos).filter(k=>k<ym).sort().reverse();
  for(const x of S.despesas)if(x.ativo&&x.freq==='mensal'&&x.cat==='fixa'&&!(g[x.id]>0)){const m=meses.find(k=>S.gastos[k][x.id]>0);if(m)g[x.id]=S.gastos[m][x.id]}
  if(Object.keys(g).length)S.gastos[ym]=g;S.fixasRep[ym]=1;save()}
function pendencia(){
  const dias=S.negocio.dias||[1,2,3,4,5,6],open=d=>dias.includes(pd(d).getDay());
  if(open(TODAY)&&!S.vendas[TODAY])return `<div class="pend"><span><b>Vendas de hoje ainda não lançadas.</b> Leva menos de 1 minuto.</span><button class="btn pri sm" data-act="lancar">Lançar agora</button></div>`;
  let first=null,n=0;for(let d=ymOf(TODAY)+'-01';d<TODAY;d=addDays(d,1))if(open(d)&&!S.vendas[d]){n++;first=first||d}
  if(n)return `<div class="pend"><span><b>${n} ${n>1?'dias':'dia'} deste mês sem vendas lançadas.</b> Eles contam como zero.</span><button class="btn sm" data-act="lancar" data-d="${first}">Lançar</button></div>`;
  const g=S.gastos[ymOf(TODAY)]||{},fM=S.despesas.filter(x=>x.ativo&&x.freq==='mensal'&&!(g[x.id]>0)).length;
  if(fM)return `<div class="pend"><span><b>${fM} ${fM>1?'contas':'conta'} de ${MESES[+ymOf(TODAY).slice(5)-1]} para lançar.</b> As variáveis mudam todo mês. Sem elas o lucro fica maior do que é.</span><button class="btn sm" data-tab="despesas">Lançar</button></div>`;
  return '';
}
function delta(a,b,opt={}){
  if(!b&&!a)return '<span class="d flat">–</span>';
  const p=pct(a,b);if(!isFinite(p))return '<span class="d flat">novo</span>';
  if(Math.abs(p)<.005)return '<span class="d flat">igual</span>';
  const g=opt.inv?p<0:p>0;return `<span class="d ${g?'good':'bad'}">${p>0?'▲':'▼'} ${fmtPct(p).replace(/^[+−]/,'')}</span>`;
}
const semVendasDia=()=>{if(ui.mode!=='dia'||S.vendas[P.r.s])return '';const wd=pd(P.r.s).getDay();
  if(!(S.negocio.dias||[]).includes(wd))return `<section class="card"><div class="cta"><div><b>${SEML[wd]}, ${dShort(P.r.s)}: dia em que o negócio fica fechado</b><span class="muted" style="font-size:.86rem">Não há vendas para comparar. Escolha outro dia${ui.view==='detalhe'?' nas setas acima':' em Detalhes'}.</span></div></div></section>`;
  return `<section class="card"><div class="cta"><div><b>As vendas de ${dShort(P.r.s)} ainda não foram lançadas</b><span class="muted" style="font-size:.86rem">Sem elas não dá para comparar o dia.</span></div><button class="btn pri" data-act="lancar" data-d="${P.r.s}">Lançar vendas</button></div></section>`};

// Indicadores de referência (Sebrae), cada um com explicação em linguagem simples e comparação com antes
function indCard(){const a=indicadores(P.cur),b=indicadores(P.prev);if(!P.cur.fat)return '';
  const pts=(x,y,inv)=>{if(x==null||y==null)return '<span class="d flat">sem comparação</span>';const d=Math.round((x-y)*100);if(!d)return '<span class="d flat">igual a antes</span>';const g=inv?d<0:d>0;return `<span class="d ${g?'good':'bad'}">${d>0?'▲':'▼'} ${Math.abs(d)} ${Math.abs(d)===1?'ponto':'pontos'}</span>`};
  const pc=x=>x==null?'–':Math.round(x*100)+'%',r100=x=>`R$ ${Math.round(Math.max(0,x)*100)}`;
  const box=(t,v,d,x)=>`<div class="ind"><div class="eyebrow">${t}</div><div class="ind-v">${v}</div>${d}<p>${x}</p></div>`;
  return `<section class="card"><div class="card-h"><h2>Indicadores do negócio</h2><p>comparado com ${esc(P.ctx)}</p></div><div class="inds">
    ${box('Lucratividade',pc(a.lucr),pts(a.lucr,b.lucr),a.lucr>=0?`De cada R$ 100 vendidos, sobraram ${r100(a.lucr)} de lucro.`:'O período deu prejuízo: os custos passaram das vendas.')}
    ${box('Margem de contribuição',pc(a.mc),pts(a.mc,b.mc),`De cada R$ 100 vendidos, ${r100(a.mc)} sobram depois de produtos, comissões e taxas, para pagar as contas fixas e dar lucro.`)}
    ${box('Ticket médio',a.ticket==null?'–':brl0(a.ticket),b.ticket?delta(a.ticket,b.ticket):'<span class="d flat">sem comparação</span>',a.porServ?'Quanto entra, em média, a cada atendimento (contando os produtos vendidos junto).':'Quanto entra, em média, a cada item vendido.')}
    ${box('Peso das contas fixas',pc(a.pesoFixo),pts(a.pesoFixo,b.pesoFixo,true),`Quanto das vendas vai para aluguel, internet e outras contas fixas (${brl0(a.fixo)} no período).`)}
  </div></section>`}

/* ---------- RESUMO: 4 respostas rápidas ---------- */
function vGeral(){
  const {cur,prev,fr,r0,r}=P,h=health(cur,prev),I=impacto(),dL=I.dL;
  const quando=ui.mode==='dia'?(r.s===TODAY?'hoje':r.s===addDays(TODAY,-1)?'ontem':'em '+dShort(r.s)):ui.mode==='semana'?(r0.s<=TODAY&&TODAY<=r0.e?'nesta semana':'na semana de '+dShort(r0.s)):(ymOf(r0.s)===ymOf(TODAY)?'neste mês':'em '+MESES[pd(r0.s).getMonth()]);
  const say=!prev.fat&&!prev.custo?'Sem dados anteriores para comparar.':`<span class="${dL>=0?'up':'dn'}">${dL>=0?'▲':'▼'} ${brl0(Math.abs(dL))} ${dL>=0?'a mais':'a menos'}</span> do que ${fr}.`;
  // comparação em texto (sem barras): seta + cor + valor de antes por extenso. Em "Saiu", subir é ruim.
  const tile=(cls,label,v,b,inv)=>{const p=pct(v,b);let diff;
    if(!b)diff='<span class="faint">sem dados para comparar</span>';else if(Math.abs(p)<.01)diff='igual a antes';
    else{const good=inv?p<0:p>0;diff=`<b class="${good?'tg':'tb'}">${p>0?'▲':'▼'} ${absPct(p)} ${p>0?'a mais':'a menos'}</b>`}
    return `<div class="tile ${cls}"><div class="eyebrow">${label}</div><div class="v">${brl0(v)}</div><div class="t">${diff}</div><div class="t">Antes: ${brl0(b)} <span class="faint">(${esc(P.ctx)})</span></div></div>`};
  const one=(x,good)=>{const ttl=good?'✓ O que mais ajudou':'✕ O que mais atrapalhou';
    return x?`<div class="peso ${good?'good':'bad'}"><div class="peso-h"><span>${ttl}</span><b>${sg(x.v)}</b></div><div class="peso-n">${esc(x.n)}</div><p>${x.t}</p></div>`
      :`<div class="peso flat"><div class="peso-h"><span>${ttl}</span></div><p>${good?'Nada fez diferença para cima.':'Nada atrapalhou. Ótimo sinal.'}</p></div>`};
  return `${topbar('Início')}
  ${viewSeg()}
  <div class="controls">${modeSeg(['Dia','Semana','Mês'])}</div>
  ${pendencia()}
  <section class="hero" aria-label="Resultado">
    <div class="top"><div class="eyebrow">Quanto sobrou ${quando}</div><span class="status ${h.c}"><i></i>${h.t}</span></div>
    <div class="big ${cur.lucro<0?'neg':''}">${brl0(cur.lucro)}</div>
    <div class="say">${say}</div>
    ${cur.fat>0?`<div class="say say2h">${cur.lucro>=0?`De cada <b>R$ 100</b> vendidos, sobraram <b>R$ ${Math.round(cur.lucro/cur.fat*100)}</b>.`:`Para cada <b>R$ 100</b> vendidos, faltaram <b>R$ ${Math.round(-cur.lucro/cur.fat*100)}</b> para pagar os custos.`}</div>`:''}
  </section>
  <div class="duo" data-tour="duo">${tile('in','Entrou (vendas)',cur.fat,prev.fat)}${tile('out','Saiu (custos e contas)',cur.custo,prev.custo,true)}</div>
  ${semVendasDia()||`<section class="card" data-tour="pesou"><div class="card-h"><h2>O que mais pesou no resultado</h2><p>comparado com ${esc(P.ctx)}</p></div><div class="aa">${one(I.pos[0],true)}${one(I.neg[0],false)}</div></section>`}
  ${eqCard()}
  <button class="btn big" data-act="view" data-v="detalhe">Ver detalhes →</button>`;
}

/* ---------- filtro de período do gráfico de vendas ---------- */
const CR_OPTS=[['auto','Acompanha o período acima'],['7d','Últimos 7 dias'],['30d','Últimos 30 dias'],['90d','Últimos 90 dias'],['ano','Este ano'],['custom','Personalizado']];
const primeiraVenda=()=>Object.keys(S.vendas).sort()[0]||TODAY;
function chartRange(){const lim=lastDataDay();let s,e=lim;
  if(ui.cr==='7d')s=addDays(lim,-6);else if(ui.cr==='30d')s=addDays(lim,-29);else if(ui.cr==='90d')s=addDays(lim,-89);else if(ui.cr==='ano')s=TODAY.slice(0,4)+'-01-01';
  else{s=ui.crDe||addDays(lim,-29);e=ui.crAte||lim;if(e>lim)e=lim;if(s>e)[s,e]=[e,s]}
  const n=daysBetween(s,e)+1;return {s,e,n,ps:addDays(s,-n),pe:addDays(s,-1)}}
const somaVendas=(s,e)=>{let t=0;for(let d=s;d<=e;d=addDays(d,1))t+=dayFat(d)||0;return t};
function crSay(){const R=chartRange(),a=somaVendas(R.s,R.e),b=somaVendas(R.ps,R.pe),d=a-b;
  return `De ${dShort(R.s)} a ${dShort(R.e)} (${R.n} ${R.n===1?'dia':'dias'}) você vendeu <b>${brl0(a)}</b>${b?`: <b class="${d>=0?'tg':'tb'}">${brl0(Math.abs(d))} ${d>=0?'a mais':'a menos'}</b> que no período anterior do mesmo tamanho (${dShort(R.ps)} a ${dShort(R.pe)})`:`. Não há vendas lançadas no período anterior (${dShort(R.ps)} a ${dShort(R.pe)}) para comparar`}.`}

/* ---------- DETALHES: comparação completa, 1 gráfico, histórico e tabelas sob demanda ---------- */
function vDetalhe(){
  const {r0,r,c,cur,prev,ctx}=P,I=impacto(),N=3,crCustom=ui.cr&&ui.cr!=='auto';
  const cmpOpts=ui.mode==='dia'?[['mes','Mesmo dia do mês passado'],['sem','Mesmo dia da semana passada']]:ui.mode==='semana'?[['mes','Mesma semana do mês passado'],['sem','Semana passada']]:null;
  const pos=ui.aaAll?I.pos:I.pos.slice(0,N),neg=ui.aaAll?I.neg:I.neg.slice(0,N),mais=I.pos.length>N||I.neg.length>N;
  const maxA=Math.max(1,...pos.map(x=>x.v),...neg.map(x=>-x.v));
  const aaRow=x=>`<div class="aa-r"><div class="aa-t"><span>${esc(x.n)} <span class="chip">${x.k}</span></span><b>${sg(x.v)}</b></div><div class="aa-bar"><i style="width:${Math.abs(x.v)/maxA*100}%"></i></div><small class="why">${x.t}</small></div>`;
  // frase do gráfico + previsão do mês corrente
  const cName=ui.mode==='mes'?MESES[pd(c.s).getMonth()]:ui.mode==='semana'?(ui.cmp==='sem'?'a semana passada':'a mesma semana do mês passado'):'';
  const dV=cur.fat-prev.fat;
  let acumSay=ui.mode==='dia'?`${brl0(cur.fat)} vendidos ${r.s===TODAY?'hoje':'neste dia'}.`:
    `${ui.mode==='mes'?`Até o dia ${pd(r.e).getDate()}`:'Até agora'} você vendeu <b class="${dV>=0?'tg':'tb'}">${brl0(Math.abs(dV))} ${dV>=0?'a mais':'a menos'}</b> que ${ui.mode==='mes'?'em '+cName+' até o mesmo dia':cName}.`;
  if(ui.mode==='mes'&&ymOf(r.s)===ymOf(TODAY)&&cur.lanc>0&&r.e<r0.e){const dias=S.negocio.dias||[1,2,3,4,5,6];let rest=0;
    for(let d=addDays(r.e,1);d<=r0.e;d=addDays(d,1))if(dias.includes(pd(d).getDay()))rest++;
    acumSay+=` No ritmo atual, ${MESES[pd(r.s).getMonth()]} deve fechar com <b>${brl0(cur.fat+cur.fat/Math.max(1,cur.lanc)*rest)}</b> em vendas.`}
  // mês a mês
  const lim=lastDataDay(),ms=[];
  for(let i=5;i>=0;i--){const ym=addYm(ymOf(r0.s),-i);let e=ym+'-'+pad(dim(ym));const partial=e>lim;if(partial)e=lim;
    const mm=e<ym+'-01'?{fat:0,custo:0,lucro:0}:metrics({s:ym+'-01',e});ms.push({ym,partial,e,fat:mm.fat,custo:mm.custo,lucro:mm.lucro})}
  const maxM=Math.max(1,...ms.map(x=>Math.max(x.fat,x.custo)));
  // tabelas
  const itens=[...new Set([...S.itens.filter(i=>i.ativo).map(i=>i.id),...Object.keys(cur.itens)])].map(id=>({n:(itemById(id)||{nome:'Item removido'}).nome,t:(itemById(id)||{}).tipo,a:cur.itens[id]||{q:0,fat:0,cmv:0},b:prev.itens[id]||{q:0,fat:0}})).sort((x,y)=>y.a.fat-x.a.fat);
  // Curva ABC: A = itens que somam até 80% do faturamento, B = até 95%, C = o resto
  {let acc=0;for(const x of itens){const antes=cur.fat?acc/cur.fat:1;x.abc=!x.a.fat?'':antes<.8?'A':antes<.95?'B':'C';acc+=x.a.fat}}
  const custos=[...Object.entries(cur.desps).map(([id,v])=>{const d=despById(id)||{};return {n:d.nome||'Despesa removida',tipo:d.cat==='fixa'?'fixa':'variável',v,b:prev.desps[id]||0}}),{n:'Produtos para revenda',tipo:'variável',v:cur.cmv,b:prev.cmv}].filter(x=>x.v>0||x.b>0).sort((a,b)=>b.v-a.v);
  return `${topbar('Início')}
  ${viewSeg()}
  <div class="controls">${modeSeg(['Dia','Semana','Mês'])}${periodNav()}
    ${cmpOpts?`<select class="sel" id="cmpSel" aria-label="Comparar com">${cmpOpts.map(([k,l])=>`<option value="${k}" ${ui.cmp===k?'selected':''}>${l}</option>`).join('')}</select>`:''}</div>

  ${semVendasDia()||`<section class="card"><div class="card-h"><h2>O que ajudou e o que atrapalhou o lucro</h2><p>comparado com ${esc(ctx)}</p></div>
    <div class="sumline"><span>O lucro ${Math.abs(I.dL)<1?'ficou igual':I.dL>0?'subiu':'caiu'}</span>${Math.abs(I.dL)>=1?`<span class="big2 ${I.dL>0?'tg':'tb'}">${I.dL>0?'▲':'▼'} ${brl0(Math.abs(I.dL))}</span>`:''}<span class="muted">de ${brl0(prev.lucro)} para ${brl0(cur.lucro)}</span></div>
    <div class="aa">
      <div class="aa-col good"><div><div class="aa-h"><span>✓ Ajudou</span><span>${sg(I.sumP)}</span></div><p class="aa-sub">O que vendeu mais ou custou menos que antes.</p></div>${pos.map(aaRow).join('')||'<p class="note" style="margin:0">Nada fez diferença para cima.</p>'}</div>
      <div class="aa-col bad"><div><div class="aa-h"><span>✕ Atrapalhou</span><span>${sg(I.sumN)}</span></div><p class="aa-sub">O que vendeu menos ou custou mais que antes.</p></div>${neg.map(aaRow).join('')||'<p class="note" style="margin:0">Nada atrapalhou. Ótimo sinal.</p>'}</div>
    </div>
    ${mais?`<button class="btn sm" data-act="aa-all" style="margin-top:12px">${ui.aaAll?'Mostrar só os 3 principais':`Ver todos (${I.pos.length+I.neg.length})`}</button>`:''}
    <p class="note" style="margin:12px 0 0">O valor de cada linha é quanto ela mudou no lucro.${Math.abs(I.small)>=1?` Outras pequenas variações (menos de R$ ${I.SMALL} cada) somam ${sg(I.small)}.`:''}${Math.abs(I.diasSum)>=1?` Contas que não mudaram de valor (${I.diasRows.slice(0,3).map(x=>esc(x.n.toLowerCase())).join(', ')}${I.diasRows.length>3?' e outras':''}) somam ${sg(I.diasSum)} só porque ${MESES[pd(r.s).getMonth()]} tem ${dim(ymOf(r.s))} dias e ${MESES[pd(c.s).getMonth()]} tem ${dim(ymOf(c.s))}.`:''}</p>
  </section>`}

  ${indCard()}

  <section class="card"><div class="card-h"><h2>${!crCustom&&ui.mode==='dia'?'Vendas dos últimos 7 dias':'Vendas acumuladas'}</h2>
    <div class="cr-ctl"><select class="sel" id="chartRange" aria-label="Período do gráfico">${CR_OPTS.map(([k,l])=>`<option value="${k}" ${(ui.cr||'auto')===k?'selected':''}>${l}</option>`).join('')}</select>
    ${ui.cr==='custom'?`<input type="date" class="sel" id="cr-de" aria-label="De" value="${chartRange().s}" min="${primeiraVenda()}" max="${lastDataDay()}"><span class="muted">até</span><input type="date" class="sel" id="cr-ate" aria-label="Até" value="${chartRange().e}" min="${primeiraVenda()}" max="${lastDataDay()}">`:''}</div></div>
    <p class="say2">${crCustom?crSay():acumSay}</p>
    <div class="chart" id="ch-line"></div></section>

  <section class="card"><div class="card-h"><h2>Mês a mês: quanto sobrou</h2>
    <div class="legend"><span><i class="sq" style="background:var(--cost)"></i>custos</span><span><i class="sq" style="background:var(--profit)"></i>sobrou (lucro)</span></div></div>
    <p class="note" style="margin:-4px 0 14px">Cada barra é tudo o que você vendeu no mês: a parte laranja pagou os custos e a azul é o que sobrou.</p>
    <div class="mm">${ms.map(x=>{const mo=+x.ym.slice(5),wc=Math.min(x.custo,x.fat)/maxM*100,wl=x.lucro>0?x.lucro/maxM*100:0,pl=x.fat?Math.round(x.lucro/x.fat*100):0;
      // rótulos dentro das barras; somem quando a parte é estreita demais para caber o texto
      return `<div class="mm-r"><div class="mm-m">${cap(MES3[mo-1])}${x.partial?`<small>até dia ${pd(x.e).getDate()}</small>`:''}</div>
      <div class="mm-bar">${x.fat?`<i class="c" style="width:${wc}%">${wc>=10?`<span>${brlK(Math.min(x.custo,x.fat))}</span>`:''}</i>${wl?`<i class="l" style="width:${wl}%">${wl>=10?`<span>${brlK(x.lucro)}${wl>=18?` · ${pl}%`:''}</span>`:''}</i>`:''}`:''}</div>
      <div class="mm-v">${x.fat?(x.lucro<0?`<b class="neg">faltou ${brlK(-x.lucro)}</b><small>vendeu ${brlK(x.fat)}</small>`:`<b>${brlK(x.fat)}</b><small>vendido</small>`):'<small>sem dados</small>'}</div></div>`}).join('')}</div>
  </section>

  <details class="card fold"><summary><div><h2>Tabela de serviços e produtos</h2><small>quanto cada um vendeu, faturou e deixou de lucro, com a curva ABC</small></div></summary>
    <div class="tbl-wrap"><table><thead><tr><th>Curva</th><th>Item</th><th class="r">Qtd</th><th class="r">Faturou</th><th class="r">Lucro por unidade</th><th class="r">vs antes</th></tr></thead><tbody>
    ${itens.map(x=>`<tr><td>${x.abc?`<span class="abc abc-${x.abc}">${x.abc}</span>`:''}</td><td>${esc(x.n)} <span class="chip">${x.t==='servico'?'serviço':'produto'}</span></td><td class="r">${num(x.a.q)}</td><td class="r">${brl0(x.a.fat)}</td><td class="r">${x.a.q?brl0((x.a.fat-x.a.cmv)/x.a.q):'–'}</td><td class="r">${delta(x.a.fat,x.b.fat)}</td></tr>`).join('')}
    </tbody></table>
    <p class="note" style="margin:10px 0 0"><b>Curva ABC:</b> <span class="abc abc-A">A</span> são os itens que somam 80% do faturamento, os que mais importam. <span class="abc abc-B">B</span> somam os 15% seguintes e <span class="abc abc-C">C</span> os últimos 5%.</p></div></details>
  <details class="card fold"><summary><div><h2>Tabela de despesas</h2><small>para onde foi o dinheiro, do maior para o menor</small></div></summary>
    <div class="tbl-wrap"><table><thead><tr><th>Despesa</th><th>Tipo</th><th class="r">Valor</th><th class="r">% do total</th><th class="r">vs antes</th></tr></thead><tbody>
    ${custos.map(x=>`<tr><td>${esc(x.n)}</td><td><span class="chip">${x.tipo}</span></td><td class="r">${brl0(x.v)}</td><td class="r">${cur.custo?Math.round(x.v/cur.custo*100):0}%</td><td class="r">${delta(x.v,x.b,{inv:true})}</td></tr>`).join('')}
    </tbody></table>
    <p class="note" style="margin:10px 0 0"><b>Fixa:</b> não muda com as vendas (aluguel, internet). <b>Variável:</b> acompanha o movimento (comissão, taxas, produtos). Dá para mudar o tipo em Cadastros.</p></div></details>

  <button class="btn big" data-act="view" data-v="geral">← Voltar para o resumo</button>`;
}

/* ---------- gráficos ---------- */
function niceMax(v){const raw=v/4,mag=Math.pow(10,Math.floor(Math.log10(raw||1))),n=raw/mag;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag*4}
function drawCharts(){if(!P||ui.view!=='detalhe')return;drawAcum()}
// Vendas acumuladas: período atual (linha cheia) x comparação (tracejada), com valores escritos no gráfico
function drawAcum(){
  const host=$('#ch-line');if(!host)return;
  // filtro próprio do gráfico: período escolhido x período anterior do mesmo tamanho
  const custom=ui.cr&&ui.cr!=='auto';let cut=P.r.e;
  if(!custom&&ui.mode==='dia')return drawDias(host);
  let days,pdays,labels,curName,cmpName;
  if(custom){const R=chartRange();cut=R.e;days=[];pdays=[];labels=[];
    for(let d=R.s;d<=R.e;d=addDays(d,1)){days.push(d);pdays.push(addDays(d,-R.n));labels.push(pd(d).getDate()+'/'+pad(pd(d).getMonth()+1))}
    curName='Período escolhido';cmpName='Período anterior'}
  else if(ui.mode==='semana'){days=[];for(let i=0;i<7;i++)days.push(addDays(P.r0.s,i));const k=ui.cmp==='sem'?-7:-28;pdays=days.map(d=>addDays(d,k));
    labels=days.map(d=>SEM[pd(d).getDay()]);curName=P.r0.e>=TODAY?'Esta semana':'Semana de '+dShort(P.r0.s);cmpName=ui.cmp==='sem'?'Semana anterior':'Mês passado'}
  else{const ym=ymOf(P.r0.s),pym=addYm(ym,-1),n=Math.max(dim(ym),dim(pym));days=[];pdays=[];labels=[];
    for(let i=1;i<=n;i++){days.push(i<=dim(ym)?ym+'-'+pad(i):null);pdays.push(i<=dim(pym)?pym+'-'+pad(i):null);labels.push(String(i))}

  const n=labels.length,W=Math.max(280,host.clientWidth),H=250,m={t:28,r:W<520?58:96,b:26,l:50},iw=W-m.l-m.r,ih=H-m.t-m.b;

  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${k?brlK(v):'0'}</text>`}

  const svg=host.querySelector('svg'),tip=host.querySelector('.tip'),hit=host.querySelector('#hit'),xh=svg.querySelector('#xh');
  const move=ev=>{const bb=svg.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round((ev.clientX-bb.left-m.l)/(iw/Math.max(1,n-1)))));
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('opacity','.5');
    tip.innerHTML=`<b>${!custom&&ui.mode==='mes'?'Até o dia '+labels[i]:'Até '+labels[i]}</b><div><span>${curName}</span><strong>${cur[i]==null?'–':brl0(cur[i])}</strong></div><div><span class="muted">${cmpName}</span><span>${cmp[i]==null?'–':brl0(cmp[i])}</span></div>`;
    tip.hidden=false;const tw=tip.offsetWidth;let lx=x(i)+12;if(lx+tw>W)lx=x(i)-tw-12;tip.style.left=Math.max(0,lx)+'px';tip.style.top='8px'};

// Visão por dia: últimos 7 dias em barras, valor escrito em cima de cada uma
function drawDias(host){
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(P.r.s,-i));
  const vals=days.map(d=>dayFat(d)||0),open=S.negocio.dias||[];
  const W=Math.max(280,host.clientWidth),H=220,m={t:26,r:4,b:34,l:4},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const max=Math.max(100,...vals),gw=iw/7,bw=Math.min(52,gw-10);
  let g='';
  days.forEach((d,i)=>{const v=vals[i],h=v/max*ih,bx=m.l+gw*i+(gw-bw)/2,top=m.t+ih-h,r=Math.min(5,h),sel=i===6;
    if(h>0)g+=`<path d="M${bx} ${m.t+ih}V${top+r}Q${bx} ${top} ${bx+r} ${top}H${bx+bw-r}Q${bx+bw} ${top} ${bx+bw} ${top+r}V${m.t+ih}Z" fill="var(--s1)" fill-opacity="${sel?1:.38}"/>`;
    const cx=bx+bw/2,closed=!v&&!open.includes(pd(d).getDay());
    g+=`<text x="${cx}" y="${top-8}" text-anchor="middle" style="fill:${sel?'var(--ink)':'var(--muted)'};font-weight:700;font-size:${W<420?10.5:12}px">${v?brlK(v):closed?'fechado':'—'}</text>`;
    g+=`<text x="${cx}" y="${H-16}" text-anchor="middle" style="fill:${sel?'var(--ink)':'var(--faint)'};font-weight:${sel?700:500}">${SEM[pd(d).getDay()]}</text><text x="${cx}" y="${H-3}" text-anchor="middle">${pd(d).getDate()}/${pad(pd(d).getMonth()+1)}</text>`});
  g+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="var(--line-2)"/>`;
  host.innerHTML=`<svg width="${W}" height="${H}" role="img" aria-label="Vendas dos últimos 7 dias">${g}</svg>`;
}

function cnpjOk(v){v=onlyD(v);if(v.length!==14||/^(\d)\1+$/.test(v))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+v[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+v[12]&&calc(13)===+v[13]}

    <h2>5. Uso não permitido</h2><p>Não é permitido usar o app para fins ilegais, tentar acessar contas de outras pessoas ou atrapalhar o funcionamento do serviço.</p>

    <h2>7. Encerramento</h2><p>Você pode excluir sua conta a qualquer momento em Minha conta. Podemos suspender contas que violem estes termos, com aviso prévio sempre que possível.</p>

  if(k==='excluir-info')return `<h1>Como excluir sua conta do Gestor Conex</h1><p class="faint">Última atualização: ${upd}</p>
    <h2>1. Pelo app</h2><p>Abra o Gestor Conex, entre na sua conta e vá em <b>Minha conta → Excluir conta</b>. Confirme sua senha e abra o link que enviamos para o seu e-mail.</p>

    <h2>3. Sem acesso à conta</h2><p>Envie um e-mail para <b class="sel">${SUPORTE}</b> a partir do e-mail cadastrado, com o assunto "Excluir minha conta". Respondemos em até 15 dias.</p>
    <h2>4. O que é excluído</h2><p>Conta, dados de cadastro, vendas, despesas, serviços, produtos e todo o histórico. A exclusão é definitiva e acontece em até 30 dias nos nossos servidores e cópias de segurança.</p>
    <h2>5. O que fica guardado e por quanto tempo</h2><ul><li>Registros de pagamento e notas fiscais: 5 anos, por obrigação fiscal.</li><li>Registros de acesso (data, hora e IP): 6 meses, como exige o Marco Civil da Internet.</li></ul><p>Depois desses prazos, também são apagados.</p>

  return `<h1>Política de privacidade</h1><p class="faint">Última atualização: ${upd}</p>
    <h2>1. Quem cuida dos seus dados</h2><p>${emp}, CNPJ ${cnpj}, é a controladora dos dados tratados no Gestor Conex. Encarregado de dados (DPO): ${dpo}.</p>

    <h2>3. Para que usamos</h2><ul><li>Prestar o serviço e calcular seus indicadores (execução de contrato).</li><li>Cobrar a assinatura e emitir nota fiscal (obrigação legal).</li><li>Proteger sua conta e evitar fraudes (legítimo interesse).</li><li>Enviar novidades, só se você autorizar (consentimento, que pode ser retirado a qualquer momento).</li></ul>

      onPrevClick:()=>d.movePrevious(),

  catch(e){const er=new Error('Sem conexão com o servidor. Confira a internet e tente de novo.');er.status=0;throw er}
