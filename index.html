  else if(a==='rm-item')arm(b,()=>{itemById(b.dataset.id).ativo=false;save();render(true);toast('Item removido')});
  else if(a==='rm-desp')arm(b,()=>{despById(b.dataset.id).ativo=false;save();render(true);toast('Despesa removida')});
  else if(a==='novo')arm(b,()=>{S=novoNegocio($('#n-seg').value,$('#n-nome').value.trim());save();ui.tab='cadastros';render();window.scrollTo(0,0);toast('Pronto. Confira seus cadastros.')});
  else if(a==='look'){ui.look=b.dataset.v;applyLook();render(true)}
  else if(a==='go-sim'){ui.tab='ajustes';render();const s=$(C&&C.real?'#novo':'#sim');if(s)s.scrollIntoView({block:'start'})}
  else if(a==='simular'){const cen=$('#sim-cen').value;
    if(!S.exemplo&&!b.classList.contains('armed')){arm(b,()=>{});toast('Isso apaga seus dados. Toque de novo para confirmar.');return}
    S=seedExemplo({cenario:cen,mov:+$('#sim-mov').value,meses:+$('#sim-mes').value,seed:(Math.random()*1e9)|0});save();ui.tab='painel';ui.view='geral';ui.mode='mes';ui.ref=TODAY;render();window.scrollTo(0,0);toast('Simulação gerada: '+CENARIOS[cen].nome)}
});
document.addEventListener('input',e=>{
  const el=e.target,mk=el.dataset&&el.dataset.mask;
  if(mk){const m=mk==='doc'?(((A.reg||{})['r-dt']||(document.querySelector('input[name="r-dt"]:checked')||{}).value||'CNPJ')==='CPF'?'cpf':'cnpj'):mk;el.value=MASK[m](el.value)}
  if(el.id&&el.id.startsWith('r-')&&!el.id.includes('pw')&&el.type!=='radio'){A.reg=A.reg||{};A.reg[el.id]=el.type==='checkbox'?el.checked:el.value}
  if(el.id==='r-pw')updPwc('pwc-reg',el.value);if(el.id==='n-pw')updPwc('pwc-nova',el.value);if(el.id==='c-new')updPwc('pwc-chg',el.value);
  const q=e.target.dataset.qid;if(q){setQty(q,e.target.value);return}
  const gid=e.target.dataset.gid;if(gid){const v=parseBRL(e.target.value),st=gStore(),k=gKey(),g=st[k]||(st[k]={});if(isNaN(v)||v<=0)delete g[gid];else g[gid]=Math.round(v*100)/100;if(!Object.keys(g).length)delete st[k];save();updG()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='lb-vendas'||el.id==='lb-desp'||el.id==='lb-hora'){LEMB={vendas:!!($('#lb-vendas')||{}).checked,desp:!!($('#lb-desp')||{}).checked,hora:+(($('#lb-hora')||{}).value)||19};
    try{localStorage.setItem(LKEY,JSON.stringify(LEMB))}catch(x){}if(LEMB.vendas||LEMB.desp)pedeLembretes(true);else agendaAgora();toast('Lembretes atualizados');return}
  if(el.name==='r-dt'){A.reg=A.reg||{};A.reg['r-dt']=el.value;A.reg['r-doc']='';render();return}
  if(el.name==='r-ini'){A.reg=A.reg||{};A.reg['r-ini']=el.value;return}
  if(el.id&&el.id.startsWith('r-')&&!el.id.includes('pw')){A.reg=A.reg||{};A.reg[el.id]=el.type==='checkbox'?el.checked:el.value;return}
  if(el.id==='vdate'){if(el.value&&el.value<=TODAY){ui.vDate=el.value;render(true)}return}
  if(el.id==='cmpSel'){ui.cmp=el.value;render(true);return}
  if(el.id==='chartRange'){ui.cr=el.value;if(el.value==='custom'&&!ui.crDe){ui.crDe=addDays(lastDataDay(),-29);ui.crAte=lastDataDay()}render(true);return}
  if(el.id==='cr-de'||el.id==='cr-ate'){if(el.value){ui[el.id==='cr-de'?'crDe':'crAte']=el.value;render(true)}return}
  if(el.dataset.gid){el.value=fmtIn((gStore()[gKey()]||{})[el.dataset.gid]);return}
  if(el.dataset.item){const it=itemById(el.dataset.item),f=el.dataset.f;
    if(f==='preco'||f==='custo'){const v=parseBRL(el.value);it[f]=isNaN(v)?0:v;el.value=fmtIn(it[f])}else if(el.value.trim()||f!=='nome')it[f]=f==='nome'?el.value.trim():el.value;save();toast('Salvo');return}
  if(el.dataset.desp){const x=despById(el.dataset.desp);if(el.value.trim())x[el.dataset.f]=el.value.trim();save();toast('Salvo');return}
  if(el.id==='a-nome'&&el.value.trim()){S.negocio.nome=el.value.trim();save();render(true);toast('Salvo');return}
  if(el.dataset.dia!=null){const d=+el.dataset.dia,s=new Set(S.negocio.dias||[]);el.checked?s.add(d):s.delete(d);S.negocio.dias=[...s].sort();save();toast('Salvo')}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(AUTH_FORMS.includes(e.target.id)){onAuthSubmit(e.target.id);return}
  if(e.target.id==='f-item'){const nome=$('#ni-nome').value.trim(),preco=parseBRL($('#ni-preco').value);if(!nome||isNaN(preco)){toast('Preencha nome e preço');return}
    S.itens.push({id:uid(),nome,tipo:$('#ni-tipo').value,preco,custo:parseBRL($('#ni-custo').value)||0,ativo:true});save();render(true);toast(`${nome} adicionado`)}
  if(e.target.id==='f-desp-q'){const nome=$('#nq-nome').value.trim();if(!nome)return;S.despesas.push({id:uid(),nome,cat:$('#nq-cat').value,freq:ui.gFreq,ativo:true});save();render(true);toast(`${nome} adicionada. Já pode lançar o valor.`);const last=S.despesas[S.despesas.length-1];setTimeout(()=>{const i=$('#g-'+last.id);if(i)i.focus()},50)}
  if(e.target.id==='f-desp'){const nome=$('#nd-nome').value.trim();if(!nome)return;S.despesas.push({id:uid(),nome,cat:$('#nd-cat').value,freq:$('#nd-freq').value,ativo:true});save();render(true);toast(`${nome} adicionada`)}
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(ui.tab==='painel')drawCharts()},150)});
if(location.hash&&VIEWS[location.hash.slice(1)])ui.tab=location.hash.slice(1);
// links públicos para as lojas (abrem sem login): /#privacidade, /#termos, /#excluir-conta
{const lh={privacidade:'privacidade',termos:'termos','excluir-conta':'excluir-info'}[(location.hash||'').slice(1)];if(lh){A.scr=lh;A.legalBack='login';ui.legal=lh;if(logged&&C){ui.tab='legal'}}
 if(location.hash==='#cadastro'&&!(logged&&C)){A.scr='cadastro'}} // botões "Testar grátis" da página inicial
if(REAL){const f=$('.side-foot');if(f)f.textContent='gestorconex.com.br'}
// Android: o voltar do aparelho volta para o Painel (ou para o login) antes de fechar o app
if(NATIVO){const AppP=(window.Capacitor.Plugins&&window.Capacitor.Plugins.App)||(window.Capacitor.registerPlugin&&window.Capacitor.registerPlugin('App'));
  if(AppP&&AppP.addListener)AppP.addListener('backButton',()=>{
    if(tourOn||A.overlay)return;
    if(!logged||!C){if(A.scr==='login'||A.scr==='excluida')return AppP.exitApp();A.scr=LEGAL_SCR.includes(A.scr)?(A.legalBack||'login'):'login';A.err='';render();window.scrollTo(0,0);return}
    if(ui.tab!=='painel'){ui.tab='painel';ui.view='geral';render();window.scrollTo(0,0)}else AppP.exitApp()})}
if(REAL)bootReal();else render();
</script>
